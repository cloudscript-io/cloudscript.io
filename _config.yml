# CloudScript.io — Jekyll configuration
# Jekyll is used ONLY for shared layouts/includes (native to GitHub Pages).
# Everything else is hand-authored HTML + CSS. No theme, no plugins, no build pipeline.

title: CloudScript.io
description: "CloudScript.io builds practical, purpose-driven apps for Confluence Cloud. Each asks only for the access its job needs, each backed by clear documentation and a plain-English privacy policy."
url: https://www.cloudscript.io

# Fallback link-preview image for any page without its own `image:` front matter
# (homepage, /news, /about, /trust, /support, /security, the Mermaid guide, 404).
# Vendor-level by design: a page that can show its own screenshot should set `image:`
# instead. Raster PNG, 1200x630 — unfurlers do not render the SVG logos in assets/img/.
# Source: Marketing/Branding/share-default-1200x630.source.html (render with headless
# Chrome at --window-size=1200,630). Vendor-neutral wording on purpose: it says
# "Atlassian", not "Confluence", so it still holds when Jira apps ship.
default_image: /assets/img/share-default.png

# News (release announcements). Posts live in _posts/ as dated Markdown files
# (YYYY-MM-DD-<app-slug>-<version>.md) and are served at /news/<slug>, e.g.
# /news/radar-renderer-2-5 — the permanent URL quoted on Crunchbase, LinkedIn
# and the Atlassian Community. This is a SITE-LEVEL permalink for posts only:
# it emits news/<slug>.html, which Pages serves extensionless, exactly like
# the hand-authored flat pages. (The CLAUDE.md rule against `permalink` front
# matter on individual pages still stands: a per-page permalink ending in "/"
# forces a trailing-slash redirect; this one does not end in "/".)
# The stream itself is news/index.html (-> /news/) and the Atom feed is
# news/feed.xml, both hand-authored Liquid — no jekyll-feed, no plugins.
# news/linkedin.xml is a second, unadvertised Atom feed read only by the Zapier -> LinkedIn
# Page Zap (body from each post's `linkedin:` front matter, else `description`).
permalink: /news/:title

# Internal / authoring files must NOT be published to the live site.
exclude:
  - CLAUDE.md
  - PROJECT_STATUS.md
  - README.md
  - design-reference/
  - content-drafts/
  - apps/page-sharing/RUNBOOK.md   # screenshot-regeneration guide (internal)
  - Gemfile
  - Gemfile.lock
  - .claude/
  - .mcp.json
  - vendor/
  - node_modules/
