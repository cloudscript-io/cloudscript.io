# CloudScript.io app registry — one YAML file per app in _data/apps/.
# Drives the homepage app directory and the /trust app table. Adding an
# app to the site = one file here + one icon at
# /assets/img/icons/<slug>.svg. stores_personal_data and documents are
# legal-adjacent: they render verbatim into the /trust table, so they are
# part of each app's human legal-review surface. An app gets a /trust
# row only once stores_personal_data is non-null.
